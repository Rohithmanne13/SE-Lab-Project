# Configuration from environment variables (OE-3, DR-6, SEC-5); defaults for local runs.
server.address=${LEDGER_HOST:127.0.0.1}
server.port=${LEDGER_PORT:8000}
ledger.db-path=${LEDGER_DB_PATH:data/ledger.db}
# Supported ISO 4217 currencies, comma-separated; must include INR and USD (FR-1.3).
ledger.currencies=${LEDGER_CURRENCIES:INR,USD}
# API keys (FR-0.1, SEC-5): comma-separated, each at least 32 random characters; there are no defaults.
ledger.client-keys=${LEDGER_CLIENT_KEYS:}
ledger.admin-keys=${LEDGER_ADMIN_KEYS:}
# Interactive API documentation at /docs in development mode (UI-1); set LEDGER_DOCS_ENABLED=false to turn it off.
ledger.docs-enabled=${LEDGER_DOCS_ENABLED:true}
# Release version reported by GET /health (FR-6.4), filled in from pom.xml at build time.
ledger.version=@project.version@
spring.main.banner-mode=off
# JSON responses always declare UTF-8 (SRS 3.3.2, CI-2).
server.servlet.encoding.force=true
# Errors never include stack traces or exception details (SEC-6); ApiExceptionHandler writes every error.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
