# Configuration from environment variables (OE-3, DR-6, SEC-5); defaults for local runs.
server.address=${LEDGER_HOST:127.0.0.1}
server.port=${LEDGER_PORT:8000}
ledger.db-path=${LEDGER_DB_PATH:data/ledger.db}
# Supported ISO 4217 currencies, comma-separated; must include INR and USD (FR-1.3).
ledger.currencies=${LEDGER_CURRENCIES:INR,USD}
# Release version reported by GET /health (FR-6.4), filled in from pom.xml at build time.
ledger.version=@project.version@
spring.main.banner-mode=off
